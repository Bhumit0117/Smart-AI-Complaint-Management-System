<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Complaint System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand-section">

                <div class="logo">SCS</div>

                <h1>Smart Complaint System</h1>

                <p>
                    AI-Powered Complaint Tracking & Resolution
                </p>

            </div>


            <div class="form-section">

                <h2>Admin Login</h2>

                <p class="form-subtitle">
                    Access the complaint management panel
                </p>


                <form id="adminLoginForm">

                    <div class="form-group">

                        <label for="adminEmail">
                            Admin Email
                        </label>

                        <input
                            type="email"
                            id="adminEmail"
                            name="adminEmail"
                            placeholder="Enter admin email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            name="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="checkbox-label">

                            <input
                                type="checkbox"
                                id="rememberAdmin"
                            >

                            Remember me

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Login as Admin
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <p class="register-text">

                    Student?

                    <a href="index.html">
                        Student Login
                    </a>

                </p>

            </div>


            <div class="auth-footer">

                <p>
                    Authorized University Administrators Only
                </p>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
