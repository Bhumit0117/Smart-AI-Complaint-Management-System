<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Complaint System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand-section">

                <div class="logo">SCS</div>

                <h1>Smart Complaint System</h1>

                <p>
                    AI-Powered Complaint Tracking & Resolution
                </p>

            </div>


            <div class="form-section">

                <h2>Create Account</h2>

                <p class="form-subtitle">
                    Register as a university student
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your university email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="checkbox-label">

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            I agree to the terms

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Account
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <p class="register-text">

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>


            <div class="auth-footer">

                <p>
                    University Complaint Management Portal
                </p>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
